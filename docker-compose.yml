version: '3.8'

services:
  movie-madness:
    build: .
    container_name: movie-madness-dev
    ports:
      - "3000:3000"
      - "127.0.0.1:3001:3001"
    volumes:
      - ./movie-man-view/src:/app/src
      - ./movie-man-view/public:/app/public
      - ${HOME}/Downloads:/downloads
    environment:
      - CHOKIDAR_USEPOLLING=true
      - MOVIEMADNESS_BRIDGE_HOST=0.0.0.0
      - MOVIEMADNESS_DOWNLOAD_DIR=/downloads
    stdin_open: true
    tty: true
